    name: "Nguyễn Tuấn Anh"
    role: "Leader"
  - id: "TUKT"
    name: "Kim Thanh Tú"
    role: "Leader"
  - id: "CHIPTL"
    name: "Phạm Thị Linh Chi"
    role: "Marketer"
  - id: "LETC"

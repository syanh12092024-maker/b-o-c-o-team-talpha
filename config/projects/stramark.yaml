    role: "Marketer"

# ─── 10. POS STATUS MAPPING (SOP) ───
# Chuẩn hoá trạng thái đơn hàng POS → category cho reporting
pos_status_mapping:
  # Giao thành công (GREEN)
  delivered:       { vn: "Đã nhận",         category: "GIAO_THANH_CONG", sub: "da_nhan",         note: "3PL giao xong, chưa đối soát" }
  received_money:  { vn: "Đã thu tiền",     category: "GIAO_THANH_CONG", sub: "da_thu_tien",     note: "3PL đã đối soát tiền" }
  # Đang giao
  packing:         { vn: "Đang đóng hàng",  category: "DANG_GIAO",       sub: "dang_dong_hang",  note: "Kho đang đóng gói" }
  pending:         { vn: "Chờ chuyển hàng",  category: "DANG_GIAO",       sub: "cho_chuyen_hang", note: "Đã lên vận đơn, chưa đóng hàng" }
  shipped:         { vn: "Đã gửi hàng",     category: "DANG_GIAO",       sub: "da_gui_hang",     note: "Đang vận chuyển đến khách" }
  # Đơn hoàn (RED)
  returning:       { vn: "Đang hoàn",       category: "DON_HOAN",        sub: "dang_hoan",       note: "Hàng đang trên đường hoàn về kho" }
  returned:        { vn: "Đã hoàn",         category: "DON_HOAN",        sub: "da_hoan",         note: "Hàng đã hoàn về kho" }
  # Hủy
  canceled:        { vn: "Đã hủy",          category: "HUY",             sub: "da_huy",          note: "Khách từ chối / không mua" }
  # Đơn thô / Trước khi xuất
  new:             { vn: "Mới",             category: "DON_THO",         sub: "moi",             note: "Đơn mới tạo" }
  submitted:       { vn: "Đã xác nhận",     category: "DA_XAC_NHAN",     sub: "da_xac_nhan",     note: "CS đã confirm" }
  waitting:        { vn: "Chờ hàng",        category: "CHO_HANG",        sub: "cho_hang",        note: "Hàng tồn kho không đủ" }
  ordered:         { vn: "Đã đặt hàng",     category: "DA_DAT_HANG",     sub: "da_dat_hang",     note: "Đã đặt hàng nhà cung cấp" }


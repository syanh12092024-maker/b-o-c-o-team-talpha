# ─── 1. THÔNG TIN DỰ ÁN ───
project_id: AUUS1
project_name: "PiAlpha US-AU"
description: "Team chạy thị trường MỸ - ÚC"
currency: USD
timezone: Asia/Ho_Chi_Minh
status: active

# ─── 2. BIGQUERY ───
bigquery:
  project_gcp: "levelup-465304"
  dataset: "AUUS1_Dataset"

# ─── 3. FACEBOOK ADS ───
meta_ads:
  app_id: "${AUUS1_META_APP_ID}"
  app_secret: "${AUUS1_META_APP_SECRET}"
  access_token: "${AUUS1_META_ACCESS_TOKEN}"       # ⚠️ Expires ~2026-04-16, renew in .env
  ad_account_ids:
    - "act_2002604803685498"                        # AU chính
    - "act_900537852593889"                          # US chính
    - "act_2026217937936451"                         # US phụ
  business_id: "1356322402694811"
  pixel_id: ""

# ─── 4. POS / ORDER MANAGEMENT ───
pos_system: poscake

poscake:
  # Multi-shop: api_key format = 32-char hex (NOT UUID with dashes)
  shops:
    - name: "US"
      api_url: "https://pos.pages.fm/api/v1"
      api_key: "${AUUS1_POSCAKE_US_KEY}"
      shop_id: "100197417"
    - name: "AU"
      api_url: "https://pos.pages.fm/api/v1"
      api_key: "${AUUS1_POSCAKE_AU_KEY}"
      shop_id: "1328333296"
  # Flat list cho agents filter
  shop_ids:
    - "100197417"
    - "1328333296"

pancake:
  api_url: "https://pages.fm/api/v1"
  api_token: ""
  page_ids: []

# ─── 5. FULFILLMENT (3PL) ───
# Mô hình đặc biệt: 100% giao thành công, thu tiền sau 10-20 ngày
# Tỷ lệ thu hồi tiền: 60-80% số đơn gửi
fulfillment:
  partners:
    - name: "AMI"
      markets: ["US"]
      fees:
        packing_fee: 1.0          # USD/đơn
        delivery_fee: 10.0        # USD/đơn (trung bình)
        cod_fee: 0                # Không có COD fee
        return_fee: 0             # Không có phí hoàn
      currency: USD
    - name: "NAZA"
      markets: ["US", "AU"]
      fees:
        packing_fee: 1.0          # USD/đơn  (AU tính AUD)
        delivery_fee: 10.0        # USD/đơn  (AU tính AUD)
        cod_fee: 0
        return_fee: 0
      currency: USD
  tracking_enabled: false

# ─── 6. THỊ TRƯỜNG ───
markets:
  - code: US
    name: "United States"
    currency: USD
    warehouse: "AMI, NAZA"
  - code: AU
    name: "Australia"
    currency: AUD
    warehouse: "NAZA"
  # JAPAN — historical only, không còn active


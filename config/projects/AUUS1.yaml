# ─── 10. SẢN PHẨM ───
# ⚠️ Giá vốn cần bổ sung qua Google Sheet
# SKU format KHÔNG thống nhất: "058 - Name" hoặc "Name - 096"
products: []   # TODO: import từ POS + Google Sheet

# ─── 11. EXCHANGE RATES ───
exchange_rates:
  - from: AUD
    to: VND
    rate: 17100
    valid_from: "2026-02-01"
  - from: USD
    to: VND
    rate: 25700
    valid_from: "2026-02-01"

# ─── 12. GIÁ BÁN (PRICING TIERS) ───
# POS lưu giá ÷100 (19900 = $199.00)
# Doanh thu = COD ÷ 100
pos_price_divisor: 100

pricing_tiers:
  US:                             # USD
    3: 199                        # Combo 3 SP = $199 (chỉ bán combo)
    5: 299                        # Combo 5 SP = $299
    note: "US KHÔNG bán lẻ 1-2 SP. Chỉ combo 3 hoặc 5."
  AU:                             # AUD
    1: 149                        # 1 SP = $149 AUD
    2: 99                         # Combo 2 = $99  (rẻ hơn 1 SP!)
    3: 149                        # Combo 3 = $149
    4: 149                        # Combo 4 = $149 (100% cố định)
    5: 249                        # Combo 5 = $249
    10: 299                       # Combo 10 = $299
    note: "2SP rẻ hơn 1SP. Combo 4 luôn $149."

# ─── 13. KPI TARGETS ───
kpi:
  roas_target: 5.0                # ROAS > 5
  backfill_days: 60               # Chưa xác nhận, tạm 60
  backfill_from: "2025-12-21"

# ─── 14. QUY TẮC VẬN HÀNH ───
# ⚠️ MÔ HÌNH ĐẶC BIỆT — KHÁC TALPHA!
operations:
  delivery_model: "post-delivery-pay"   # Giao hàng xong mới thu tiền
  delivery_success_rate: 1.0            # 100% giao thành công
  cash_collection_rate: "60-80%"        # Chỉ 60-80% đơn thu được tiền
  cash_collection_delay: "10-20 days"   # 10-20 ngày mới nhận tiền
  return_policy: "none"                 # Không có return/re-stock
  cost_source:
    - "pos"
    - "google_sheet"
  fixed_costs: "pending"
  pos_revenue_field: "cod"


# ─── CAMPAIGN NAME PATTERN ───
# Pattern hiện tại (từ data thực tế)
campaign_name_pattern_current: "{MARKET}/{MARKETER}/{PRODUCT_VN}/{PAGE_ID}/{PAGE_NAME}/{DATE}"
# Pattern chuẩn (recomment cho tương lai)
campaign_name_pattern_new: "{MARKET}/{MKT_CODE}/{SKU}-{PRODUCT}/{PAGE_ID}/{PAGE_NAME}/{DATE}"

# ─── POS SKU PATTERN ───
# Products trong POS đặt tên: "{NUMBER} - {ENGLISH_NAME}"
# VD: "005 - Diamond Halo set", "010 - Birth Stone Set"
# Field `sku` trống — extract mã số từ đầu tên
pos_sku_extraction: "regex: ^(\\d{3})\\s*-\\s*(.+)$"
